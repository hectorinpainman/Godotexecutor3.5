<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Brotato</title>
<style>
  html, body { margin:0; height:100%; background:#111; color:#eee; font-family:system-ui,sans-serif; }
  #setup { max-width:420px; margin:10vh auto; padding:0 20px; text-align:center; }
  button, input { font-size:16px; margin:6px 0; }
  button { padding:10px 18px; }
  #canvas { display:none; width:100%; height:100%; }
  #status { margin-top:12px; font-size:14px; opacity:.8; white-space:pre-wrap; }
  #dbgbox { margin-top:28px; opacity:.6; }
  #dbgbox input { width:120px; padding:6px; background:#222; color:#eee; border:1px solid #444; border-radius:6px; text-align:center; }

  #hud { position:fixed; top:env(safe-area-inset-top,0px); right:0; z-index:10000; font:11px ui-monospace,Menlo,monospace;
         background:rgba(0,0,0,.65); color:#9f9; padding:3px 7px; border-bottom-left-radius:6px; }

  #dbg { display:none; position:fixed; left:0; right:0; bottom:0; height:45%; z-index:9999;
         background:rgba(0,0,0,.92); color:#cfc; border-top:2px solid #4a4; flex-direction:column; }
  #dbg.open { display:flex; }
  #dbgbar { display:flex; gap:8px; align-items:center; padding:6px 10px; background:#122; font:14px system-ui; color:#eee; }
  #dbgbar span { flex:1; }
  #dbgbar button { margin:0; padding:6px 12px; font-size:14px; }
  #dbglog { flex:1; overflow:auto; margin:0; padding:8px 10px; font:12px/1.35 ui-monospace,Menlo,monospace;
            white-space:pre-wrap; word-break:break-word; -webkit-overflow-scrolling:touch; }
  .l-error { color:#f66; } .l-warn { color:#fc6; } .l-godot { color:#8cf; } .l-net { color:#aaa; } .l-info { color:#cfc; }
</style>
<script>
/* ===== Debug logger: installed first so it catches everything ===== */
window.__step = 'idle';
window.DBG = (function () {
  const KEY = 'dbg-last';
  const lines = [];
  const MAX = 2000;
  let el = null, timer = null, prev = null;
  try { prev = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) {}   // read BEFORE we overwrite it

  const ts = () => ((performance.now() / 1000).toFixed(2) + 's');
  const str = a => {
    if (a instanceof Error) return a.stack || (a.name + ': ' + a.message);
    if (typeof a === 'object' && a !== null) { try { return JSON.stringify(a); } catch (e) { return String(a); } }
    return String(a);
  };
  function save() {
    timer = null;
    try {
      localStorage.setItem(KEY, JSON.stringify({
        step: window.__step, saved: Date.now(), lines: lines.slice(-150).map(l => l.text)
      }));
    } catch (e) {}
  }
  function add(level, args) {
    const text = '[' + ts() + '] ' + Array.prototype.map.call(args, str).join(' ');
    lines.push({ level, text });
    if (lines.length > MAX) lines.shift();
    if (el) {
      const d = document.createElement('div');
      d.className = 'l-' + level; d.textContent = text;
      el.appendChild(d);
      while (el.childNodes.length > MAX) el.removeChild(el.firstChild);
      el.scrollTop = el.scrollHeight;
    }
    if (!timer) timer = setTimeout(save, 700);
  }
  return {
    prev,
    log: (level, ...a) => add(level, a),
    saveNow: save,
    attach(node) {
      el = node; el.textContent = '';
      lines.forEach(l => { const d = document.createElement('div'); d.className = 'l-' + l.level; d.textContent = l.text; el.appendChild(d); });
      el.scrollTop = el.scrollHeight;
    },
    clear() { lines.length = 0; if (el) el.textContent = ''; },
    dump() { return lines.map(l => l.text).join('\n'); }
  };
})();

['log', 'info', 'warn', 'error', 'debug'].forEach(k => {
  const orig = console[k] ? console[k].bind(console) : () => {};
  const lvl = k === 'error' ? 'error' : k === 'warn' ? 'warn' : 'info';
  console[k] = function () { orig.apply(null, arguments); DBG.log(lvl, ...arguments); };
});
window.addEventListener('error', e => {
  if (e.target && e.target !== window && (e.target.src || e.target.href)) {
    DBG.log('error', 'RESOURCE FAILED TO LOAD:', e.target.src || e.target.href);
  } else {
    DBG.log('error', 'JS ERROR:', e.message, '@', (e.filename || '').split('/').pop() + ':' + e.lineno + ':' + e.colno, e.error || '');
  }
}, true);
window.addEventListener('unhandledrejection', e => DBG.log('error', 'UNHANDLED PROMISE REJECTION:', e.reason));

if (window.fetch) {
  const of = window.fetch.bind(window);
  window.fetch = function (input, init) {
    const url = typeof input === 'string' ? input : (input && input.url);
    const quiet = init && init.method === 'HEAD';
    return of(input, init).then(r => {
      if (!quiet) DBG.log(r.ok ? 'net' : 'error', 'fetch', (init && init.method) || 'GET', url, '->', r.status);
      return r;
    }, err => { if (!quiet) DBG.log('error', 'fetch FAILED', url, err); throw err; });
  };
}

/* ===== WebAssembly memory tracking (must run before godot.js) ===== */
try {
  const OrigMem = WebAssembly.Memory;
  const mb = n => (n / 1048576).toFixed(0) + ' MB';
  WebAssembly.Memory = function (desc) {
    const m = new OrigMem(desc);
    window.__mem = m;
    DBG.log('info', 'WASM memory created: initial', mb(desc.initial * 65536),
            '| maximum', desc.maximum ? mb(desc.maximum * 65536) : 'none', desc.shared ? '| shared' : '');
    return m;
  };
  WebAssembly.Memory.prototype = OrigMem.prototype;
  const origGrow = OrigMem.prototype.grow;
  OrigMem.prototype.grow = function (pages) {
    const before = this.buffer.byteLength;
    try {
      const r = origGrow.call(this, pages);
      DBG.log('info', 'WASM memory grew', mb(before), '->', mb(this.buffer.byteLength));
      return r;
    } catch (e) {
      DBG.log('error', 'WASM MEMORY GROW FAILED: was', mb(before), '| tried to add', mb(pages * 65536), '|', e);
      throw e;
    }
  };
} catch (e) { DBG.log('warn', 'Could not hook WebAssembly.Memory', e); }

/* ===== Report what happened in the previous session (survives a tab crash) ===== */
if (DBG.prev) {
  const p = DBG.prev;
  const ago = Math.round((Date.now() - p.saved) / 1000);
  const abnormal = p.step && p.step !== 'idle' && p.step !== 'running';
  DBG.log(abnormal ? 'error' : 'info',
    'PREVIOUS SESSION: last step was "' + p.step + '", last log ' + ago + 's before this page loaded' +
    (abnormal ? ' -> it probably CRASHED or was killed by iOS during that step' : ''));
  if (abnormal) (p.lines || []).slice(-40).forEach(t => DBG.log('warn', '  prev>', t));
}
</script>
</head>
<body>
<div id="hud">0s | idle | n/a</div>
<div id="setup">
  <h1>Brotato</h1>
  <div id="pick"><input type="file" id="pck"><br></div>
  <button id="play">Play</button><br>
  <button id="forget">Remove saved .pck</button>
  <div id="status"></div>
  <div id="dbgbox"><input id="dbgin" placeholder="type: debug" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"></div>
</div>
<canvas id="canvas" tabindex="0"></canvas>

<div id="dbg">
  <div id="dbgbar">
    <span>Debug console</span>
    <button id="dbgprev">Prev</button>
    <button id="dbgcopy">Copy</button>
    <button id="dbgclear">Clear</button>
    <button id="dbgclose">Close</button>
  </div>
  <div id="dbglog"></div>
</div>

<script>
/* ---- SETTING: where are godot.js / godot.wasm / godot.audio.worklet.js? ----
   ''     = in the repo root
   '3.7'  = inside a /3.7/ folder                                            */
const RUNTIME_DIR = '';
const RT = RUNTIME_DIR ? RUNTIME_DIR + '/' : '';

const $ = id => document.getElementById(id);
const setStatus = t => { $('status').textContent = t; DBG.log('info', 'STATUS:', t); };
const memMB = () => window.__mem ? ((window.__mem.buffer.byteLength / 1048576) | 0) + ' MB' : 'n/a';

let stepStart = performance.now();
function setStep(s) {
  window.__step = s; stepStart = performance.now();
  DBG.log('info', 'STEP:', s);
  DBG.saveNow();
}

/* ===== Heartbeat: detects freezes, drives the HUD ===== */
let lastBeat = performance.now(), lastStillNotice = 0;
setInterval(() => {
  const now = performance.now();
  const gap = now - lastBeat; lastBeat = now;
  const visible = document.visibilityState === 'visible';
  if (visible && gap > 1500) {
    DBG.log('warn', 'MAIN THREAD STALLED for ' + (gap / 1000).toFixed(1) + 's (step: ' + window.__step + ', wasm mem: ' + memMB() + ')');
  }
  const inStep = Math.floor((now - stepStart) / 10000);
  if (visible && window.__step !== 'idle' && window.__step !== 'running' && inStep >= 2 && inStep !== lastStillNotice) {
    lastStillNotice = inStep;
    DBG.log('warn', 'Still in step "' + window.__step + '" after ' + Math.round((now - stepStart) / 1000) + 's (wasm mem: ' + memMB() + ')');
  }
  $('hud').textContent = Math.round(now / 1000) + 's | ' + window.__step + ' | ' + memMB();
}, 500);
$('hud').onclick = () => openDebug();

document.addEventListener('visibilitychange', () => DBG.log('info', 'visibility:', document.visibilityState));
window.addEventListener('pagehide', () => { DBG.log('warn', 'pagehide'); DBG.saveNow(); });
window.addEventListener('pageshow', e => DBG.log('info', 'pageshow (from bfcache: ' + e.persisted + ')'));

/* ===== Debug panel ===== */
function openDebug() { $('dbg').classList.add('open'); DBG.attach($('dbglog')); }
function closeDebug() { $('dbg').classList.remove('open'); }
$('dbgclose').onclick = closeDebug;
$('dbgclear').onclick = () => DBG.clear();
$('dbgprev').onclick = () => {
  const p = DBG.prev;
  if (!p) return DBG.log('info', 'No previous session log stored.');
  DBG.log('info', '--- PREVIOUS SESSION (last step "' + p.step + '") ---');
  (p.lines || []).forEach(t => DBG.log('warn', 'prev>', t));
  DBG.log('info', '--- END PREVIOUS ---');
};
$('dbgcopy').onclick = async () => {
  try { await navigator.clipboard.writeText(DBG.dump()); $('dbgcopy').textContent = 'Copied!'; }
  catch (e) {
    const r = document.createRange(); r.selectNodeContents($('dbglog'));
    const s = getSelection(); s.removeAllRanges(); s.addRange(r);
    $('dbgcopy').textContent = 'Selected - tap Copy in menu';
  }
  setTimeout(() => $('dbgcopy').textContent = 'Copy', 2000);
};
$('dbgin').addEventListener('keydown', e => {
  if (e.key === 'Enter') { if ($('dbgin').value.trim().toLowerCase() === 'debug') openDebug(); $('dbgin').value = ''; }
});
let typed = '';
window.addEventListener('keydown', e => {
  if (!e.key || e.key.length !== 1) return;
  typed = (typed + e.key.toLowerCase()).slice(-5);
  if (typed === 'debug') { typed = ''; openDebug(); }
}, true);
if (/debug/i.test(location.hash) || /[?&]debug/i.test(location.search)) openDebug();
let taps = [];
window.addEventListener('pointerdown', e => {
  if (e.clientX < 70 && e.clientY < 70) {
    const n = Date.now(); taps = taps.filter(t => n - t < 2000); taps.push(n);
    if (taps.length >= 5) { taps = []; openDebug(); }
  }
}, true);

/* ===== Load the engine script ===== */
const runtimeReady = new Promise((res, rej) => {
  const s = document.createElement('script');
  s.src = RT + 'godot.js';
  s.onload = res;
  s.onerror = () => rej(new Error('Could not load ' + s.src));
  document.head.appendChild(s);
});
runtimeReady.catch(e => DBG.log('error', String(e)));

/* ===== Startup diagnostics ===== */
(async function diagnostics() {
  DBG.log('info', '--- Environment ---');
  DBG.log('info', 'URL:', location.href);
  DBG.log('info', 'UA:', navigator.userAgent);
  DBG.log('info', 'WebAssembly:', typeof WebAssembly !== 'undefined');
  DBG.log('info', 'SharedArrayBuffer:', typeof SharedArrayBuffer !== 'undefined', '| crossOriginIsolated:', window.crossOriginIsolated);
  if (navigator.deviceMemory) DBG.log('info', 'deviceMemory (GB, capped):', navigator.deviceMemory);
  if (performance.memory) DBG.log('info', 'JS heap limit (MB):', (performance.memory.jsHeapSizeLimit / 1048576) | 0);
  try {
    DBG.log('info', 'WebGL2:', !!document.createElement('canvas').getContext('webgl2'),
            '| WebGL1:', !!document.createElement('canvas').getContext('webgl'));
  } catch (e) { DBG.log('error', 'WebGL check failed', e); }
  try {
    if (navigator.storage && navigator.storage.estimate) {
      const s = await navigator.storage.estimate();
      DBG.log('info', 'Storage used/quota (MB):', (s.usage / 1048576 | 0), '/', (s.quota / 1048576 | 0));
    }
  } catch (e) {}
  DBG.log('info', '--- File check (HEAD) ---');
  for (const f of ['godot.js', 'godot.wasm', 'godot.audio.worklet.js']) {
    try {
      const r = await fetch(RT + f, { method: 'HEAD', cache: 'no-store' });
      DBG.log(r.ok ? 'info' : 'error', RT + f, '->', r.status, r.ok ? ((r.headers.get('content-length') || '?') + ' bytes') : '');
    } catch (e) { DBG.log('error', RT + f, 'unreachable', e); }
  }
  DBG.log('info', '--- Ready ---');
})();

/* ===== IndexedDB cache for the .pck ===== */
const db = () => new Promise((res, rej) => {
  const r = indexedDB.open('brotato-loader', 1);
  r.onupgradeneeded = () => r.result.createObjectStore('files');
  r.onsuccess = () => res(r.result);
  r.onerror = () => rej(r.error);
});
const idb = async (mode, fn) => {
  const d = await db();
  return new Promise((res, rej) => {
    const tx = d.transaction('files', mode);
    const req = fn(tx.objectStore('files'));
    tx.oncomplete = () => res(req.result);
    tx.onerror = () => rej(tx.error);
  });
};

(async () => {
  try {
    const saved = await idb('readonly', s => s.get('pck'));
    if (saved) {
      $('pick').style.display = 'none';
      setStatus('Saved .pck found (' + (saved.size / 1048576 | 0) + ' MB).');
    } else {
      setStatus('Choose your Brotato .pck file.');
    }
  } catch (e) {
    console.error('IndexedDB read failed', e);
    setStatus('Storage unavailable; you will need to pick the file each time.');
  }
})();

$('forget').onclick = async () => {
  try { await idb('readwrite', s => s.delete('pck')); } catch (e) { console.error(e); }
  $('pick').style.display = '';
  setStatus('Removed. Choose a .pck file.');
};

/* ===== Read engine version from the .pck header (info only) ===== */
async function logPackHeader(blob) {
  try {
    const b = await blob.slice(0, 20).arrayBuffer();
    const magic = String.fromCharCode(...new Uint8Array(b, 0, 4));
    if (magic !== 'GDPC') return DBG.log('warn', 'No GDPC header at start of file (embedded pck or wrong file?)');
    const v = new DataView(b);
    DBG.log('info', 'Pack header: format', v.getUint32(4, true), '| engine',
            v.getUint32(8, true) + '.' + v.getUint32(12, true) + '.' + v.getUint32(16, true));
  } catch (e) { DBG.log('warn', 'Header read failed', e); }
}

let busy = false;
$('play').onclick = async () => {
  if (busy) return;
  busy = true;
  try { await play(); } finally { busy = false; }
};

async function play() {
  const t0 = performance.now();
  const lap = name => DBG.log('info', '  [' + name + '] done,', ((performance.now() - t0) / 1000).toFixed(1) + 's since Play');

  setStep('choosing .pck');
  let blob = null;
  try { blob = await idb('readonly', s => s.get('pck')); } catch (e) { console.error('cache read failed', e); }
  const f = $('pck').files[0];
  if (f) {
    blob = f;
    DBG.log('info', 'Picked file:', f.name, (f.size / 1048576).toFixed(1) + ' MB');
    try { await idb('readwrite', s => s.put(f, 'pck')); DBG.log('info', 'Cached .pck in IndexedDB'); }
    catch (e) { console.warn('cache failed', e); }
  }
  if (!blob) { setStep('idle'); return setStatus('No .pck selected.'); }
  await logPackHeader(blob);

  const canvas = $('canvas');
  canvas.addEventListener('webglcontextlost', () => DBG.log('error', 'WEBGL CONTEXT LOST (GPU or memory pressure?)'), false);
  canvas.addEventListener('webglcontextcreationerror', e => DBG.log('error', 'WebGL context creation error:', e.statusMessage || ''), false);

  try {
    setStep('loading engine script');
    await runtimeReady;
    if (typeof Engine === 'undefined') throw new Error('godot.js loaded but Engine is undefined');
    lap('engine script');

    let lastPct = -1;
    const engine = new Engine({
      canvas,
      onProgress: (cur, total) => {
        if (!total) return;
        const p = Math.floor(cur / total * 10) * 10;
        if (p !== lastPct) { lastPct = p; DBG.log('net', 'Engine download progress:', p + '%'); }
      },
      onPrint: (...a) => DBG.log('godot', 'GODOT:', ...a),
      onPrintError: (...a) => DBG.log('error', 'GODOT ERR:', ...a)
    });

    setStep('engine.init (wasm)');
    setStatus('Loading engine...');
    await engine.init(RT + 'godot');
    lap('engine.init');

    setStep('reading .pck into memory');
    setStatus('Loading game data...');
    let buf;
    try { buf = await blob.arrayBuffer(); }
    catch (e) {
      throw new Error('Could not read .pck into memory (' + e + '). Likely out of memory, or the file is an iCloud placeholder that has not finished downloading.');
    }
    DBG.log('info', 'Read', (buf.byteLength / 1048576).toFixed(1) + ' MB (blob.size', (blob.size / 1048576).toFixed(1) + ' MB) | wasm mem:', memMB());
    lap('read .pck');

    setStep('preloading .pck into engine');
    await engine.preloadFile(buf, 'game.pck');
    buf = null;
    lap('preloadFile');

    $('setup').style.display = 'none';
    canvas.style.display = 'block';
    setStep('engine.start (game booting)');
    await engine.start({
      canvas,
      args: ['--main-pack', 'game.pck'],
      onExit: code => DBG.log('warn', 'Engine exited with code', code)
    });
    lap('engine.start');
    setStep('running');
  } catch (e) {
    setStep('failed');
    $('setup').style.display = '';
    canvas.style.display = 'none';
    console.error('Launch failed:', e);
    setStatus('Error: ' + e + '\nReload the page before trying again.\n(Tap the green badge, top right, for details)');
  }
}
</script>
</body>
</html>
