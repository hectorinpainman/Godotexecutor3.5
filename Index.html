<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Brotato</title>
<style>
  html, body { margin:0; height:100%; background:#111; color:#eee; font-family:system-ui,sans-serif; }
  #setup { max-width:420px; margin:12vh auto; padding:0 20px; text-align:center; }
  button, input { font-size:16px; margin:6px 0; }
  button { padding:10px 18px; }
  #canvas { display:none; width:100%; height:100%; }
  #status { margin-top:12px; font-size:14px; opacity:.8; white-space:pre-wrap; }
</style>
<script src="godot.js"></script>
</head>
<body>
<div id="setup">
  <h1>Brotato</h1>
  <div id="pick"><input type="file" id="pck"><br></div>
  <button id="play">Play</button><br>
  <button id="forget">Remove saved .pck</button>
  <div id="status"></div>
</div>
<canvas id="canvas" tabindex="0"></canvas>

<script>
const $ = id => document.getElementById(id);
const status = t => $('status').textContent = t;

// ---- tiny IndexedDB wrapper for caching the .pck Blob ----
const db = () => new Promise((res, rej) => {
  const r = indexedDB.open('brotato-loader', 1);
  r.onupgradeneeded = () => r.result.createObjectStore('files');
  r.onsuccess = () => res(r.result);
  r.onerror = () => rej(r.error);
});
const idb = async (mode, fn) => {
  const d = await db();
  return new Promise((res, rej) => {
    const tx = d.transaction('files', mode);
    const req = fn(tx.objectStore('files'));
    tx.oncomplete = () => res(req.result);
    tx.onerror = () => rej(tx.error);
  });
};

(async () => {
  try {
    const saved = await idb('readonly', s => s.get('pck'));
    if (saved) {
      $('pick').style.display = 'none';
      status('Saved .pck found (' + (saved.size / 1048576 | 0) + ' MB).');
    } else {
      status('Choose your Brotato .pck file.');
    }
  } catch (e) {
    status('Storage unavailable; you will need to pick the file each time.');
  }
})();

$('forget').onclick = async () => {
  try { await idb('readwrite', s => s.delete('pck')); } catch (e) {}
  $('pick').style.display = '';
  status('Removed. Choose a .pck file.');
};

$('play').onclick = async () => {
  let blob = null;
  try { blob = await idb('readonly', s => s.get('pck')); } catch (e) {}
  const f = $('pck').files[0];
  if (f) {
    blob = f;
    try { await idb('readwrite', s => s.put(f, 'pck')); } catch (e) { console.warn('cache failed', e); }
  }
  if (!blob) return status('No .pck selected.');

  const canvas = $('canvas');
  status('Loading engine...');
  const engine = new Engine();
  try {
    await engine.init('godot');
    status('Loading game data...');
    await engine.preloadFile(await blob.arrayBuffer(), 'game.pck');
    $('setup').style.display = 'none';
    canvas.style.display = 'block';
    await engine.start({ canvas, args: ['--main-pack', 'game.pck'] });
  } catch (e) {
    $('setup').style.display = '';
    canvas.style.display = 'none';
    status('Error: ' + e);
    console.error(e);
  }
};
</script>
</body>
</html>
