name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  GODOT_VERSION: "3.5.3"   # match your Brotato's engine version (3.5, 3.5.1, 3.5.2, 3.5.3)

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Godot web runtime
        run: |
          V="${GODOT_VERSION}"
          [ "$V" = "3.5" ] && TAG="3.5-stable" || TAG="${V}-stable"
          curl -fL -o t.tpz "https://github.com/godotengine/godot/releases/download/${TAG}/Godot_v${TAG}_export_templates.tpz"
          unzip -q t.tpz 'templates/webassembly_release.zip'
          mkdir site
          unzip -q templates/webassembly_release.zip -d site
          cp index.html site/
          ls -la site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
